<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Annotated anatomy of a research binder</title>
<desc id="desc">An open binder with six callouts identifying the cover, rings, subject folder, dividers, clip, and closure. This is an original explanatory schematic rather than one historical model.</desc>
<rect width="1400" height="900" fill="#fff" />
<text x="48" y="66" font-family="Arial" fill="#162126" font-size="37" font-weight="bold">A workbook with several kinds of attachment</text>
<text x="48" y="103" font-family="Arial" fill="#526166" font-size="18">Original schematic · October 2026 · Historical features vary by model</text>
<rect x="410" y="185" width="575" height="485" rx="16" fill="#d9e6e5" stroke="#233a40" stroke-width="3" />
<rect x="660" y="185" width="34" height="485" fill="#b7ceca" stroke="#233a40" stroke-width="2" />
<rect x="431" y="235" width="218" height="407" rx="5" fill="#bdd6e0" stroke="#233a40" stroke-width="2" />
<rect x="457" y="259" width="166" height="330" fill="#fff" stroke="#667d82" stroke-width="1.5" />
<text x="476" y="294" font-family="Arial" fill="#526166" font-size="18">SOURCES</text>
