<g><ellipse cx="678" cy="291" rx="40" ry="17" fill="#233a40" /><ellipse cx="678" cy="291" rx="32" ry="9" fill="#b7ceca" /><ellipse cx="678" cy="428" rx="40" ry="17" fill="#233a40" /><ellipse cx="678" cy="428" rx="32" ry="9" fill="#b7ceca" /><ellipse cx="678" cy="565" rx="40" ry="17" fill="#233a40" /><ellipse cx="678" cy="565" rx="32" ry="9" fill="#b7ceca" /></g><g fill="#233a40"><circle cx="432" cy="186" r="17" fill="#233a40" /><circle cx="677" cy="428" r="17" fill="#233a40" /><circle cx="546" cy="518" r="17" fill="#233a40" /><circle cx="963" cy="312" r="17" fill="#233a40" /><circle cx="822" cy="234" r="17" fill="#233a40" /><circle cx="1007" cy="441" r="17" fill="#233a40" /></g>
<g class="num" text-anchor="middle"><text x="432" y="194" font-family="Arial" fill="white" class="num" text-anchor="middle" font-size="23" font-weight="bold">1</text><text x="677" y="436" font-family="Arial" fill="white" class="num" text-anchor="middle" font-size="23" font-weight="bold">2</text><text x="546" y="526" font-family="Arial" fill="white" class="num" text-anchor="middle" font-size="23" font-weight="bold">3</text><text x="963" y="320" font-family="Arial" fill="white" class="num" text-anchor="middle" font-size="23" font-weight="bold">4</text><text x="822" y="242" font-family="Arial" fill="white" class="num" text-anchor="middle" font-size="23" font-weight="bold">5</text><text x="1007" y="449" font-family="Arial" fill="white" class="num" text-anchor="middle" font-size="23" font-weight="bold">6</text></g>
<path d="M414 185H357V213H50 M660 428H360V388H50 M529 518H353V574H50 M980 312H1020V288H1070 M839 234H1000V178H1070 M1026 441H1060V475H1070" fill="none" stroke="#334d53" stroke-width="2" />
<text x="50" y="247" font-family="Arial" fill="#162126" font-size="24" font-weight="bold">1 Cover and spine</text><text x="50" y="278" font-family="Arial" fill="#162126" font-size="21">Protect; name the collection.</text><text x="50" y="308" font-family="Arial" fill="#162126" font-size="21">Give it a public face.</text>
<text x="50" y="421" font-family="Arial" fill="#162126" font-size="24" font-weight="bold">2 Opening rings</text><text x="50" y="452" font-family="Arial" fill="#162126" font-size="21">Insert, remove, rearrange.</text><text x="50" y="482" font-family="Arial" fill="#162126" font-size="21">A sequence you can revise.</text>
<text x="50" y="607" font-family="Arial" fill="#162126" font-size="24" font-weight="bold">3 Folder and pockets</text><text x="50" y="638" font-family="Arial" fill="#162126" font-size="21">Hold unpunched material.</text><text x="50" y="668" font-family="Arial" fill="#162126" font-size="21">Carry one section away.</text>
<text x="1070" y="211" font-family="Arial" fill="#162126" font-size="24" font-weight="bold">5 Temporary clip</text><text x="1070" y="241" font-family="Arial" fill="#162126" font-size="21">Keep working sheets</text><text x="1070" y="271" font-family="Arial" fill="#162126" font-size="21">within easy reach.</text>
<text x="1070" y="329" font-family="Arial" fill="#162126" font-size="24" font-weight="bold">4 Dividers and labels</text><text x="1070" y="359" font-family="Arial" fill="#162126" font-size="21">Supply entry points.</text><text x="1070" y="389" font-family="Arial" fill="#162126" font-size="21">Student additions here.</text>
<text x="1070" y="514" font-family="Arial" fill="#162126" font-size="24" font-weight="bold">6 Flap and closure</text><text x="1070" y="544" font-family="Arial" fill="#162126" font-size="21">Make a portable whole.</text><text x="1070" y="574" font-family="Arial" fill="#162126" font-size="21">Snap or hook-and-loop.</text>
<path d="M48 749h1304" stroke="#bdc9cb" />
<text x="48" y="796" font-family="Arial" fill="#162126" font-size="21">Pocket = provisional attachment. Rings = chosen sequence. Folder = a removable working collection.</text>
<text x="48" y="837" font-family="Arial" fill="#526166" font-size="18">Based on published patent drawings and Mead product specifications; see the essay for sources and model distinctions.</text>
</svg>