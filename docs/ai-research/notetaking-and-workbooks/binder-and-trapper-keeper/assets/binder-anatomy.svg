<rect x="944" y="463" width="30" height="65" rx="3" fill="#afa8ce" stroke="#57666a" />
<rect x="720" y="257" width="212" height="361" fill="#fff" stroke="#879395" stroke-width="1.5" />
<text x="742" y="310" font-family="Arial" fill="#526166" font-size="18">QUESTIONS</text>
